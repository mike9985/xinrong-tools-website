<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Xinrong Inquiries</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .dashboard-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }
    .dashboard-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .dash-stat {
      background: var(--color-white);
      border-radius: var(--radius-md);
      padding: 1.5rem;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--color-gray-200);
    }
    .dash-stat-number {
      font-size: 2rem;
      font-weight: 800;
      color: var(--color-primary);
    }
    .dash-stat-label {
      font-size: 0.85rem;
      color: var(--color-gray-500);
      margin-top: 0.25rem;
    }
    .table-wrapper {
      overflow-x: auto;
      background: var(--color-white);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--color-gray-200);
    }
    .badge {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge-new { background: #dbeafe; color: #1d4ed8; }
    .dashboard-loading {
      text-align: center;
      padding: 3rem;
      color: var(--color-gray-400);
    }
    .dashboard-error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: var(--radius-md);
      padding: 1.5rem;
      color: var(--color-error);
      text-align: center;
    }
    .btn-logout {
      background: transparent;
      color: rgba(255,255,255,0.8);
      border: 1px solid rgba(255,255,255,0.3);
      padding: 0.4rem 1rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 0.85rem;
      transition: all var(--transition-base);
    }
    .btn-logout:hover {
      background: rgba(255,255,255,0.1);
      color: var(--color-white);
    }
    .refresh-time {
      font-size: 0.8rem;
      color: rgba(255,255,255,0.6);
    }
    @media (max-width: 768px) {
      .dashboard-stats { grid-template-columns: repeat(2, 1fr); }
      .dashboard-table th, .dashboard-table td { font-size: 0.8rem; padding: 0.6rem 0.5rem; }
    }
  </style>
</head>
<body>

<!-- ===== Login Gate ===== -->
<div id="login-gate" class="login-gate">
  <div class="login-card">
    <h2>Dashboard Access</h2>
    <p style="color: var(--color-gray-500); margin-bottom: 1.5rem; font-size: 0.95rem;">Enter the password to view inquiries.</p>
    <div class="form-group">
      <input type="password" id="dash-password" placeholder="Password" style="text-align: center;">
    </div>
    <div id="login-error" class="form-error"></div>
    <button class="btn btn-primary" onclick="login()" style="width:100%">Access Dashboard</button>
  </div>
</div>

<!-- ===== Dashboard (hidden initially) ===== -->
<div id="dashboard-content" style="display:none;">
  <header class="dashboard-header">
    <div class="container">
      <div style="display: flex; align-items: center; gap: 1rem;">
        <span style="font-weight: 800; font-size: 1.2rem;">XINRONG</span>
        <span style="font-size: 0.85rem; color: rgba(255,255,255,0.5);">| Inquiry Dashboard</span>
      </div>
      <div style="display: flex; align-items: center; gap: 1rem;">
        <span class="refresh-time" id="refresh-time"></span>
        <button class="btn-logout" onclick="logout()">Logout</button>
      </div>
    </div>
  </header>

  <div class="dashboard-container">
    <!-- Stats -->
    <div class="dashboard-stats" id="dash-stats">
      <div class="dash-stat"><div class="dash-stat-number" id="stat-total">-</div><div class="dash-stat-label">Total Inquiries</div></div>
      <div class="dash-stat"><div class="dash-stat-number" id="stat-today">-</div><div class="dash-stat-label">Today</div></div>
      <div class="dash-stat"><div class="dash-stat-number" id="stat-week">-</div><div class="dash-stat-label">This Week</div></div>
      <div class="dash-stat"><div class="dash-stat-number" id="stat-products">-</div><div class="dash-stat-label">Product Types</div></div>
    </div>

    <!-- Table -->
    <div class="table-wrapper">
      <div class="dashboard-loading" id="loading-state">Loading inquiries...</div>
      <div class="dashboard-error" id="error-state" style="display:none;"></div>
      <div class="dashboard-empty" id="empty-state" style="display:none;">
        <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5" style="width:48px;height:48px;margin:0 auto 1rem;opacity:0.5"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/></svg>
        <p>No inquiries yet. Inquiries will appear here when customers submit the contact form.</p>
      </div>
      <table class="dashboard-table" id="inquiries-table" style="display:none;">
        <thead>
          <tr>
            <th>Date</th>
            <th>Name</th>
            <th>Company</th>
            <th>Email</th>
            <th>Product</th>
            <th>Quantity</th>
            <th>Message</th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase.js"></script>
<script>
// Simple password protection (change this in production)
const DASH_PASSWORD = 'xinrong2024';

function login() {
  const input = document.getElementById('dash-password');
  const errorEl = document.getElementById('login-error');

  if (input.value === DASH_PASSWORD) {
    document.getElementById('login-gate').style.display = 'none';
    document.getElementById('dashboard-content').style.display = 'block';
    sessionStorage.setItem('xinrong_dash_auth', 'true');
    loadInquiries();
  } else {
    errorEl.textContent = 'Incorrect password. Please try again.';
    errorEl.classList.add('visible');
    input.value = '';
  }
}

function logout() {
  sessionStorage.removeItem('xinrong_dash_auth');
  location.reload();
}

// Check if already authenticated
if (sessionStorage.getItem('xinrong_dash_auth') === 'true') {
  document.getElementById('login-gate').style.display = 'none';
  document.getElementById('dashboard-content').style.display = 'block';
  loadInquiries();
}

// Allow Enter key to submit
document.getElementById('dash-password').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') login();
});

async function loadInquiries() {
  const loadingEl = document.getElementById('loading-state');
  const errorEl = document.getElementById('error-state');
  const emptyEl = document.getElementById('empty-state');
  const table = document.getElementById('inquiries-table');
  const tbody = document.getElementById('table-body');
  const refreshTime = document.getElementById('refresh-time');

  loadingEl.style.display = 'block';
  errorEl.style.display = 'none';
  emptyEl.style.display = 'none';
  table.style.display = 'none';

  try {
    const data = await fetchInquiries();

    loadingEl.style.display = 'none';

    if (!data || data.length === 0) {
      emptyEl.style.display = 'block';
      updateStats([]);
      return;
    }

    // Update stats
    updateStats(data);

    // Populate table
    tbody.innerHTML = data.map(row => `
      <tr>
        <td style="white-space:nowrap;font-size:0.8rem;color:var(--color-gray-400);">${formatDate(row.created_at)}</td>
        <td><strong>${escapeHtml(row.name)}</strong></td>
        <td>${escapeHtml(row.company || '-')}</td>
        <td><a href="mailto:${escapeHtml(row.email)}" style="font-size:0.85rem;">${escapeHtml(row.email)}</a></td>
        <td><span class="badge badge-new">${escapeHtml(row.product || 'General')}</span></td>
        <td>${escapeHtml(row.quantity || '-')}</td>
        <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${escapeHtml(row.message || '')}">${escapeHtml(row.message || '-')}</td>
      </tr>
    `).join('');

    table.style.display = '';
    refreshTime.textContent = `Last updated: ${new Date().toLocaleTimeString()}`;
  } catch (err) {
    console.error('Dashboard error:', err);
    loadingEl.style.display = 'none';
    errorEl.textContent = 'Failed to load inquiries. Please check your connection and try again.';
    errorEl.style.display = 'block';
  }
}

function updateStats(data) {
  const now = new Date();
  const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const weekStart = new Date(todayStart);
  weekStart.setDate(weekStart.getDate() - weekStart.getDay());

  const total = data.length;
  const today = data.filter(r => new Date(r.created_at) >= todayStart).length;
  const week = data.filter(r => new Date(r.created_at) >= weekStart).length;
  const products = new Set(data.map(r => r.product).filter(Boolean)).size;

  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-today').textContent = today;
  document.getElementById('stat-week').textContent = week;
  document.getElementById('stat-products').textContent = products;
}

function formatDate(dateStr) {
  if (!dateStr) return '-';
  const d = new Date(dateStr);
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function escapeHtml(str) {
  if (!str) return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
</script>
</body>
</html>
